# Pages CMS configuration. Generated from cms/model.mjs.
# Client content lives in content/. Layout and integration settings are not exposed as CMS fields.
media:
  - name: images
    label: Images and logos
    input: public
    output: /
    extensions:
      - jpg
      - jpeg
      - jfif
      - png
      - webp
      - avif
      - gif
    rename: safe
  - name: documents
    label: PDF documents
    input: public/uploads/documents
    output: /uploads/documents
    extensions:
      - pdf
    rename: safe
content:
  - name: shared
    label: Across the website
    type: group
    items:
      - name: shared-brand
        label: Company name and logos
        type: file
        path: content/shared/brand.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: name
            label: Company name (two short lines)
            type: text
            required: true
            options:
              maxlength: 80
            description: Line breaks are kept. Keep headings short so they fit the existing design.
          - name: logo
            label: Company logo
            type: object
            required: true
            description: The original logo keeps its existing crop. A replacement is displayed in full beside the company
              name.
            fields:
              - name: src
                label: Image
                type: image
                required: true
                options:
                  media: images
                  path: public/uploads/images
                  extensions:
                    - jpg
                    - jpeg
                    - jfif
                    - png
                    - webp
                    - avif
                    - gif
              - name: alt
                label: Image description (alt text)
                type: text
                required: false
                options:
                  maxlength: 400
                description: Describe what the image shows. Decorative background photos may have an empty description.
          - name: homeLabel
            label: Logo link description
            type: string
            required: true
            options:
              maxlength: 180
      - name: shared-navigation
        label: Navigation and header buttons
        type: file
        path: content/shared/navigation.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: howItWorks
            label: How It Works
            type: object
            required: true
            fields:
              - name: text
                label: Button or link text
                type: string
                required: true
                options:
                  maxlength: 60
              - name: url
                label: Destination
                type: string
                required: true
                options:
                  maxlength: 1800
                pattern:
                  regex: ^(https?://|mailto:|tel:|/|#|[A-Za-z0-9_-]+\.html)
